name: Upload to Google Play

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Enter a release tag, or use latest for the latest GitHub release
        required: true
        default: latest
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  upload-to-google-play:
    environment: google-play
    runs-on: ubuntu-latest
    steps:
      - name: Download assets from the selected release
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          # Resolve latest through GitHub, while allowing a specific tag to be selected.
          if [ "$RELEASE_TAG" = "latest" ]; then
            # The release list includes pre-releases and excludes drafts.
            RELEASE_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --json tagName --jq '.[0].tagName')"
          else
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          RELEASE_URL="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          mkdir release-assets
          # Fetch only the AAB asset(s) needed for Play publishing.
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern '*.aab'
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json name,tagName,url

      - name: Create Google Play whatsnew from GitHub release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.download.outputs.release_tag }}
          RELEASE_URL: ${{ steps.download.outputs.release_url }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md
          mkdir -p play-whatsnew
          # Keep highlight entries while removing GitHub-only headings and footer links.
          {
            printf '# %s\n\n' "$RELEASE_TAG"
            awk '
              /^#+[[:space:]]*🔥 Highlights[[:space:]]*$/ {
                in_highlights = 1
                next
              }
              in_highlights && /^#+[[:space:]]/ { exit }
              in_highlights { print }
            ' release-notes.md |
              sed -E \
                -e '/^\*\*Full Changelog\*\*:/d' \
                -e 's/[[:space:]]+by[[:space:]]+[^[:space:]]+[[:space:]]+in[[:space:]]+(https?:\/\/[^[:space:]]*\/pull\/[0-9]+|#[0-9]+).*$//'
            printf '\nFull Release-Notes: %s\n' "$RELEASE_URL"
          } | awk 'NF { blank = 0; print; next } !blank { print; blank = 1 }' > play-whatsnew/whatsnew-en-US
          test -s play-whatsnew/whatsnew-en-US
          # Google Play limits each localized whatsnew entry to 500 Unicode characters.
          CHAR_COUNT="$(LC_ALL=C.UTF-8 wc -m < play-whatsnew/whatsnew-en-US | tr -d '[:space:]')"
          if [ "$CHAR_COUNT" -gt 500 ]; then
            echo "Generated Google Play whatsnew is $CHAR_COUNT characters; the limit is 500." >&2
            exit 1
          fi
          cat play-whatsnew/whatsnew-en-US

      - name: Find the Android package to publish
        id: package
        run: |
          # Accept only one AAB so an APK release asset cannot be published accidentally.
          mapfile -t packages < <(find release-assets -maxdepth 1 -type f -name '*.aab' -print)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one .aab release asset; found ${#packages[@]}." >&2
            exit 1
          fi
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"

      # Use short-lived GitHub OIDC credentials instead of storing a service-account key.
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: com.github.vauvenal5.yaga
          releaseFiles: ${{ steps.package.outputs.path }}
          whatsNewDirectory: play-whatsnew
          tracks: internal
          status: completed
