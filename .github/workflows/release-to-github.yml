name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Keep artifact locations consistent across build, verification, signing, and release steps.
env:
  AAB_BUILD_PATH: build/app/outputs/bundle/release/app-release.aab
  APK_BUILD_PATH: build/app/outputs/flutter-apk/app-release.apk
  AAB_RELEASE_PATH: release-assets/app-release.aab
  APK_RELEASE_PATH: release-assets/app-release.apk

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    strategy:
      matrix:
        artifact: [appbundle, apk]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Fail before the Android build when this pre-release tag is already published.
      - name: Check pre-release tag
        if: ${{ inputs.prerelease }}
        run: |
          VERSION="$(sed -n 's/^version: \([^+ ]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          TAG="v$VERSION-pre"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Pre-release tag $TAG already exists." >&2
            exit 1
          else
            STATUS=$?
            if [ "$STATUS" -ne 2 ]; then
              exit "$STATUS"
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          # Cache the Flutter SDK and Dart pub packages between workflow runs.
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Disable the plugin's linker build ID so the APK matches the F-Droid build.
      # This can be removed once we upgraded flutter_zxing to a version higher than 3.0.1.
      - name: Patch flutter_zxing CMake build ID
        if: ${{ matrix.artifact == 'apk' }}
        run: |
          set -euo pipefail
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          shopt -s nullglob
          CMAKE_FILES=("$PUB_CACHE_DIR"/hosted/pub.dev/flutter_zxing-*/src/CMakeLists.txt)
          ((${#CMAKE_FILES[@]} > 0))
          for CMAKE_LISTS in "${CMAKE_FILES[@]}"; do
            if ! grep -Fq 'add_link_options("LINKER:--build-id=none")' "$CMAKE_LISTS"; then
              sed -i '1a add_link_options("LINKER:--build-id=none")' "$CMAKE_LISTS"
            fi
          done

      # Separate runners avoid concurrent Gradle builds writing to the same outputs.
      - name: Build Android release artifact
        run: flutter build "${{ matrix.artifact }}" --release

      - name: Attest Android release artifact
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ matrix.artifact == 'appbundle' && env.AAB_BUILD_PATH || env.APK_BUILD_PATH }}

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          # Use Flutter's direct APK output for F-Droid reproducible build checks.
          path: ${{ matrix.artifact == 'appbundle' && env.AAB_BUILD_PATH || env.APK_BUILD_PATH }}
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    environment: github
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Collect both artifacts after the independent release builds finish.
      - name: Download Android release artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # Verify provenance and source revision before the release key signs these artifacts.
      - name: Verify Android build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in "$AAB_RELEASE_PATH" "$APK_RELEASE_PATH"; do
            gh attestation verify "$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-to-github.yml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA"
          done

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Preserve APK padding so F-Droid can copy and verify the upstream signature.
      - name: Sign Android release artifacts
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPLOAD_KEYSTORE_JKS_B64: ${{ secrets.UPLOAD_KEYSTORE_JKS_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$UPLOAD_KEYSTORE_JKS_B64"
          test -n "$UPLOAD_KEYSTORE_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/upload-keystore.jks"
          APK="$GITHUB_WORKSPACE/$APK_RELEASE_PATH"
          AAB="$GITHUB_WORKSPACE/$AAB_RELEASE_PATH"
          test -s "$APK"
          test -s "$AAB"
          printf '%s' "$UPLOAD_KEYSTORE_JKS_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"

          # ubuntu-latest includes Build Tools 36.0.0 under ANDROID_HOME.
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          # Match the locally verified APK signature scheme: V2 only.
          "$APKSIGNER" sign \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:UPLOAD_KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --alignment-preserved \
            "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          jarsigner \
            -keystore "$KEYSTORE" \
            -storepass:env UPLOAD_KEYSTORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"

      - name: Clean up Android signing files
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      # Attest the exact signed files that will be published as release assets.
      - name: Attest signed Android release artifacts
        uses: actions/attest@v4.2.2
        with:
          subject-path: |
            ${{ env.AAB_RELEASE_PATH }}
            ${{ env.APK_RELEASE_PATH }}

      # Publish the bundle and APK together on the GitHub release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          VERSION="$(sed -n 's/^version: \([^+ ]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if [ "$PRERELEASE" = "true" ]; then
            # Add the pre-release suffix so beta tags stay distinct from stable tags.
            TAG="$TAG-pre"
          fi
          # Keep the pre-release marker in the title instead of repeating the tag suffix.
          TITLE="v$VERSION"
          if [ "$PRERELEASE" = "true" ]; then
            TITLE="$TITLE Beta"
          fi
          gh release create "$TAG" \
            "$AAB_RELEASE_PATH" \
            "$APK_RELEASE_PATH" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes \
            --prerelease="$PRERELEASE"
