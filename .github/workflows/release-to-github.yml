name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # This environment supplies the Android signing secrets to the job.
    environment: github
    strategy:
      matrix:
        artifact: [appbundle, apk]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Fail before the Android build when this pre-release tag is already published.
      - name: Check pre-release tag
        if: ${{ inputs.prerelease }}
        run: |
          VERSION="$(sed -n 's/^version: \([^+ ]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          TAG="v$VERSION-pre"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Pre-release tag $TAG already exists." >&2
            exit 1
          else
            STATUS=$?
            if [ "$STATUS" -ne 2 ]; then
              exit "$STATUS"
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          # Cache the Flutter SDK and Dart pub packages between workflow runs.
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Materialize ignored signing files only for this ephemeral CI build.
      - name: Prepare Android signing
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPLOAD_KEYSTORE_JKS_B64: ${{ secrets.UPLOAD_KEYSTORE_JKS_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$UPLOAD_KEYSTORE_JKS_B64"
          test -n "$UPLOAD_KEYSTORE_PASSWORD"
          printf '%s' "$UPLOAD_KEYSTORE_JKS_B64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$UPLOAD_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/upload-keystore.jks android/key.properties

      # Separate runners avoid concurrent Gradle builds writing to the same outputs.
      - name: Build Android release artifact
        run: flutter build "${{ matrix.artifact }}" --release

      # Remove private signing material even when an earlier step fails.
      - name: Clean up Android signing files
        if: ${{ always() }}
        run: rm -f android/key.properties android/upload-keystore.jks

      - name: Upload Android release artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          # Use Flutter's direct APK output for F-Droid reproducible build checks.
          path: ${{ matrix.artifact == 'appbundle' && 'build/app/outputs/bundle/release/app-release.aab' || 'build/app/outputs/flutter-apk/app-release.apk' }}
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Collect both artifacts after the independent release builds finish.
      - name: Download Android release artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      # Publish the bundle and APK together on the GitHub release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          VERSION="$(sed -n 's/^version: \([^+ ]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          TAG="v$VERSION"
          if [ "$PRERELEASE" = "true" ]; then
            # Add the pre-release suffix so beta tags stay distinct from stable tags.
            TAG="$TAG-pre"
          fi
          # Keep the pre-release marker in the title instead of repeating the tag suffix.
          TITLE="v$VERSION"
          if [ "$PRERELEASE" = "true" ]; then
            TITLE="$TITLE Beta"
          fi
          gh release create "$TAG" \
            release-assets/app-release.aab \
            release-assets/app-release.apk \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes \
            --prerelease="$PRERELEASE"
