name: Deploy Hugo site to Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Keep the build job read-only; deployment permissions are granted only to deploy.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.169.0
      HUGO_SHA256: a20f7da84e0981bebbecc032cc87f0dda2049a844727720aab14e61ce416e5e9
      DART_SASS_VERSION: 1.107.1
      DART_SASS_SHA256: 6cefe78692d03ca53843394bb98de4dccf9a3d8ee5ece40be7316be852624003
    steps:
      - name: Install Hugo CLI
        run: |
          # Verify the pinned Hugo package before installing it.
          curl --fail --location --silent --show-error \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" \
            --output "$RUNNER_TEMP/hugo.deb"
          echo "$HUGO_SHA256  $RUNNER_TEMP/hugo.deb" | sha256sum --check --status
          sudo dpkg -i "$RUNNER_TEMP/hugo.deb"
      - name: Install Dart Sass
        run: |
          # Install a fixed Sass release and verify its archive before extraction.
          curl --fail --location --silent --show-error \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            --output "$RUNNER_TEMP/dart-sass.tar.gz"
          echo "$DART_SASS_SHA256  $RUNNER_TEMP/dart-sass.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/dart-sass.tar.gz" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      # Match Hugo's module toolchain to the version declared by the docs project.
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: docs/go.mod
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Hugo
        working-directory: docs
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./docs/public

  # Deployment job
  deploy:
    # Pages publishing and its OIDC token are needed only by the deployment job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
