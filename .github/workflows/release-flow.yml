name: Release Flow

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # This environment supplies the Android signing secrets to the job.
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version-file: .fvmrc
          # Cache the Flutter SDK and Dart pub packages between workflow runs.
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Materialize ignored signing files only for this ephemeral CI build.
      - name: Prepare Android signing
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UPLOAD_KEYSTORE_JKS_B64: ${{ secrets.UPLOAD_KEYSTORE_JKS_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$UPLOAD_KEYSTORE_JKS_B64"
          test -n "$UPLOAD_KEYSTORE_PASSWORD"
          printf '%s' "$UPLOAD_KEYSTORE_JKS_B64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$UPLOAD_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/upload-keystore.jks android/key.properties

      # Upload the bundle so the dependent release job can publish the same build.
      - name: Build Android app bundle
        run: flutter build appbundle --release

      - name: Upload Android app bundle
        uses: actions/upload-artifact@v7.0.2
        with:
          name: yaga-android-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Remove private signing material even when an earlier step fails.
      - name: Clean up Android signing files
        if: ${{ always() }}
        run: rm -f android/key.properties android/upload-keystore.jks

  # The github environment can gate publication after each successful build.
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: github
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the built commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download Android app bundle
        uses: actions/download-artifact@v8.0.2
        with:
          name: yaga-android-release-aab
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          VERSION="$(sed -n 's/^version: \([^+ ]*\).*/\1/p' pubspec.yaml)"
          test -n "$VERSION"
          # Keep tags stable and mark beta builds in the GitHub release title.
          TAG="v$VERSION"
          TITLE="$TAG"
          if [ "$PRERELEASE" = "true" ]; then
            TITLE="$TITLE Beta"
          fi
          gh release create "$TAG" \
            release-assets/app-release.aab \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes \
            --prerelease="$PRERELEASE"
